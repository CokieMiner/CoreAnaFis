[package]
name = "core_anafis"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["CokieMiner"]
description = "Native limb types and the parallel execution engine shared by the AnaFis arithmetic crates"
license = "Apache-2.0"
repository = "https://github.com/CokieMiner/CoreAnaFis"
keywords = ["bigint", "multiprecision", "parallel", "no-std"]
categories = ["concurrency", "mathematics", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true

[features]
# Executes independent work in the active Rayon pool; see the crate documentation.
rayon = ["dep:rayon"]

[dependencies]
rayon = { version = "1.12.0", optional = true, default-features = false }

[dev-dependencies]
proptest = "1.12.0"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused_results = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(miri)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
as_conversions = "deny"
indexing_slicing = "deny"
integer_division = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
shadow_unrelated = "deny"
shadow_reuse = "deny"
